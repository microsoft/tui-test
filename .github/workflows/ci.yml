name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: macos-latest
            bin: target/debug/tui-test
            go-target: aarch64-apple-darwin
            go-library: libtui_test_go.dylib
          - os: windows-latest
            bin: target/debug/tui-test.exe
            go-target: x86_64-pc-windows-msvc
            go-library: tui_test_go.dll
          - os: ubuntu-latest
            bin: target/debug/tui-test
            go-target: x86_64-unknown-linux-gnu
            go-library: libtui_test_go.so
    runs-on: ${{ matrix.os }}
    env:
      TUI_TEST_BIN: ${{ github.workspace }}/${{ matrix.bin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable
          rustup component add clippy rustfmt

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p tui-test-rs --all-targets --no-default-features -- -D warnings
      - run: cargo build
      - run: cargo test --workspace -- --test-threads=1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bindings/go/go.mod
          cache: false

      - name: Build Go native library and verify header
        shell: bash
        run: |
          cargo build --locked -p tui-test-go
          git diff --exit-code -- bindings/go/internal/native/native.h
          mkdir -p bindings/go/internal/native/embedded/${{ matrix.go-target }}
          cp target/debug/${{ matrix.go-library }} bindings/go/internal/native/embedded/${{ matrix.go-target }}/

      - name: Check Go formatting, vet, and tests
        shell: bash
        working-directory: bindings/go
        env:
          CGO_ENABLED: "0"
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run ./examples/smoke

      - name: Check Go races
        shell: bash
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Check Go native layout against the C compiler
        shell: bash
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
        run: |
          "$(go env CC)" --version
          go test -tags=tuitest_abi_check -run '^TestNativeLayoutMatchesCompiler$' -count=1 ./internal/native

      - name: Verify Go lint configuration and lint binding
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: bindings/go
          verify: true
          args: ./...
        env:
          CGO_ENABLED: "0"

      - name: Install Python binding
        run: python -m pip install --disable-pip-version-check -e ./bindings/python

      - name: Test Python binding
        run: python -m unittest discover -s bindings/python/tests -v

      - name: Verify generated Python stubs
        run: python bindings/python/scripts/generate_stubs.py --check

      - name: Install Node dependencies
        run: npm ci --prefix bindings/js

      - name: Test Node binding
        run: npm run test:node --prefix bindings/js

      - name: Verify generated Node loader
        shell: bash
        run: |
          git diff --exit-code -- bindings/js/native/index.js bindings/js/native/index.d.ts
          ! grep -Eq 'JsonValue|Promise<unknown>|\brequest\(|\bBuffer\b' bindings/js/native/index.d.ts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os == 'Linux'
        with:
          bun-version: latest

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: runner.os == 'Linux'
        with:
          deno-version: v2.x

      - name: Test Node binding with Bun
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm run test:bun --prefix bindings/js

      - name: Test Node binding with Deno
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm run test:deno --prefix bindings/js

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.8
            runtime: python
            version: "3.8"
          - name: Python current
            runtime: python
            version: "3.14"
          - name: Node 20
            runtime: node
            version: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.runtime == 'python'
        with:
          python-version: ${{ matrix.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.runtime == 'node'
        with:
          node-version: ${{ matrix.version }}
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json

      - name: Test Python compatibility
        if: matrix.runtime == 'python'
        run: |
          python -m pip install --disable-pip-version-check -e ./bindings/python
          python -m unittest discover -s bindings/python/tests -v

      - name: Test Node compatibility
        if: matrix.runtime == 'node'
        run: |
          npm ci --prefix bindings/js
          npm run test:node --prefix bindings/js
