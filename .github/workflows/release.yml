name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify release versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const expected = process.env.RELEASE_TAG.replace(/^v/, "");
          const jsPackage = JSON.parse(
            fs.readFileSync("bindings/js/package.json", "utf8"),
          );
          const versions = {
            "Cargo.toml": fs.readFileSync("Cargo.toml", "utf8").match(
              /^\s*version\s*=\s*"([^"]+)"/m,
            )?.[1],
            "bindings/js/package.json": jsPackage.version,
            "bindings/js/src/version.ts": fs.readFileSync(
              "bindings/js/src/version.ts",
              "utf8",
            ).match(/VERSION\s*=\s*"([^"]+)"/)?.[1],
            "bindings/python/pyproject.toml": fs.readFileSync(
              "bindings/python/pyproject.toml",
              "utf8",
            ).match(/^\s*version\s*=\s*"([^"]+)"/m)?.[1],
            "bindings/python/src/shell_use/_config.py": fs.readFileSync(
              "bindings/python/src/shell_use/_config.py",
              "utf8",
            ).match(/VERSION\s*=\s*"([^"]+)"/)?.[1],
          };

          for (const [file, version] of Object.entries(versions)) {
            if (version !== expected) {
              throw new Error(`${file} has version ${version}; expected ${expected}`);
            }
          }
          const nativeLoader = fs.readFileSync(
            "bindings/js/native/index.js",
            "utf8",
          );
          if (!nativeLoader.includes(`'${expected}'`)) {
            throw new Error(
              "bindings/js/native/index.js was not regenerated for " + expected,
            );
          }
          NODE

  build-cli:
    needs: verify
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable
          rustup target add ${{ matrix.target }}

      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - run: cargo build --release --locked -p shell-use-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc

      - if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../shell-use-${{ matrix.target }}.tar.gz shell-use
          cd -

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/shell-use.exe" -DestinationPath "shell-use-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: shell-use-${{ matrix.target }}
          path: |
            shell-use-*.tar.gz
            shell-use-*.zip

  build-node:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            args: --target x86_64-unknown-linux-gnu --use-napi-cross
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            args: --target aarch64-unknown-linux-gnu --use-napi-cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            args: --target x86_64-unknown-linux-musl -x
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            args: --target aarch64-unknown-linux-musl -x
            zig: true
          - target: x86_64-apple-darwin
            os: macos-latest
            args: --target x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            args: --target aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            args: --target x86_64-pc-windows-msvc
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            args: --target aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: "0.14.1"

      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild

      - run: npm ci
        working-directory: bindings/js

      - name: Build Node addon
        working-directory: bindings/js
        shell: bash
        run: npm run build:native -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: bindings/js/native/*.node
          if-no-files-found: error

  package-node:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json

      - run: npm ci
        working-directory: bindings/js

      - run: |
          npm run build:ts
          npm run create:npm-dirs
        working-directory: bindings/js

      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: bindings/js/artifacts
          merge-multiple: true

      - run: npm run artifacts
        working-directory: bindings/js

      - name: Pack Node packages
        shell: bash
        run: |
          mkdir -p package-artifacts/npm
          for package in bindings/js/npm/*; do
            if ! compgen -G "$package/*.node" >/dev/null; then
              echo "::error::Missing native addon in $package."
              exit 1
            fi
            npm pack "$package" --pack-destination package-artifacts/npm
          done

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const packagePath = "bindings/js/package.json";
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          pkg.optionalDependencies = {};
          for (const entry of fs.readdirSync("bindings/js/npm")) {
            const manifest = JSON.parse(
              fs.readFileSync(
                path.join("bindings/js/npm", entry, "package.json"),
                "utf8",
              ),
            );
            pkg.optionalDependencies[manifest.name] = manifest.version;
          }
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + "\n");
          NODE

          npm pack ./bindings/js \
            --ignore-scripts \
            --pack-destination package-artifacts/npm

          node <<'NODE'
          const fs = require("node:fs");
          const packagePath = "bindings/js/package.json";
          const readmePath = "bindings/js/README.md";
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          pkg.name = "shell-use";
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + "\n");
          fs.writeFileSync(
            readmePath,
            fs.readFileSync(readmePath, "utf8").replaceAll(
              "@microsoft/shell-use",
              "shell-use",
            ),
          );
          NODE

          npm pack ./bindings/js \
            --ignore-scripts \
            --pack-destination package-artifacts/npm

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: package-artifacts/npm/*.tgz
          if-no-files-found: error

  build-python:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            compatibility: "2_28"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            compatibility: "2_28"
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            compatibility: "musllinux_1_2"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            compatibility: "musllinux_1_2"
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux' && contains(matrix.target, 'aarch64')
        with:
          platforms: arm64

      - name: Build Python wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.compatibility || 'auto' }}
          args: --release --locked --out dist --compatibility pypi

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  build-python-sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --disable-pip-version-check "maturin>=1.5,<2"

      - name: Build Python sdist
        working-directory: bindings/python
        run: maturin sdist --manifest-path native/Cargo.toml --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish-npm:
    needs:
      - smoke-node
      - release
    if: always() && needs.smoke-node.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish native and root packages
        shell: bash
        run: |
          publish_if_missing() {
            local tarball="$1"
            local package_name
            local package_version

            read -r package_name package_version < <(
              tar -xOf "$tarball" package/package.json |
                node -e '
                  let input = "";
                  process.stdin.on("data", chunk => input += chunk);
                  process.stdin.on("end", () => {
                    const pkg = JSON.parse(input);
                    console.log(`${pkg.name} ${pkg.version}`);
                  });
                '
            )

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published"
              return
            fi

            npm publish "$tarball" --access public --provenance --tag latest
          }

          shopt -s nullglob
          packages=(npm-packages/*.tgz)
          if [[ "${#packages[@]}" -lt 10 ]]; then
            echo "::error::Expected eight native packages and two root packages."
            exit 1
          fi

          for package in "${packages[@]}"; do
            name="$(tar -xOf "$package" package/package.json | node -pe '
              JSON.parse(require("fs").readFileSync(0, "utf8")).name
            ')"
            if [[ "$name" == @microsoft/shell-use-* ]]; then
              publish_if_missing "$package"
            fi
          done

          for package in "${packages[@]}"; do
            name="$(tar -xOf "$package" package/package.json | node -pe '
              JSON.parse(require("fs").readFileSync(0, "utf8")).name
            ')"
            if [[ "$name" == "@microsoft/shell-use" || "$name" == "shell-use" ]]; then
              publish_if_missing "$package"
            fi
          done

  publish-pypi:
    needs:
      - smoke-python
      - build-python-sdist
      - release
    if: always() && needs.smoke-python.result == 'success' && needs.build-python-sdist.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shell-use
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist

      - name: Publish shell-use to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    needs:
      - build-cli
      - smoke-node
      - smoke-python
      - build-python-sdist
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: shell-use-*
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --generate-notes \
            artifacts/*

  smoke-node:
    needs: package-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install packed root and platform packages
        shell: bash
        run: |
          root_package="$(
            for package in npm-packages/*.tgz; do
              name="$(tar -xOf "$package" package/package.json | node -pe '
                JSON.parse(require("fs").readFileSync(0, "utf8")).name
              ')"
              [[ "$name" == "@microsoft/shell-use" ]] && echo "$package"
            done
          )"
          platform_package="$(
            for package in npm-packages/*.tgz; do
              name="$(tar -xOf "$package" package/package.json | node -pe '
                JSON.parse(require("fs").readFileSync(0, "utf8")).name
              ')"
              [[ "$name" == "@microsoft/shell-use-linux-x64-gnu" ]] && echo "$package"
            done
          )"

          test -n "$root_package"
          test -n "$platform_package"
          mkdir smoke
          cd smoke
          npm init -y >/dev/null
          npm install --ignore-scripts "../$platform_package"
          npm install --ignore-scripts --omit=optional "../$root_package"

          node --input-type=module <<'NODE'
          import { ShellUse } from "@microsoft/shell-use";

          const session = ShellUse.ephemeral("release-smoke");
          try {
            await session.open();
            await session.submit("echo release-smoke");
            await session.waitCommand();
            await session.expectText("release-smoke", { strict: false });
          } finally {
            await session.closeQuiet();
          }
          NODE

  smoke-python:
    needs: build-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel-x86_64-unknown-linux-gnu
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install built wheel
        shell: bash
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl

          smoke/bin/python <<'PY'
          import asyncio
          from shell_use import ShellUse

          async def main():
              async with ShellUse.ephemeral("release-smoke") as session:
                  await session.open()
                  await session.submit("echo release-smoke")
                  await session.wait_command()
                  await session.expect_text("release-smoke", strict=False)

          asyncio.run(main())
          PY
