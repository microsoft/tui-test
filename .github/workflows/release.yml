name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable

      - run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Release tag must match <major>.<minor>.<patch> or <major>.<minor>.<patch>-beta.<number>." >&2
            exit 1
          fi

      - name: Verify release versions
        shell: bash
        run: |
          version="$RELEASE_TAG"
          version_files=(
            Cargo.toml
            bindings/js/package.json
            bindings/js/package-lock.json
            bindings/js/src/version.ts
            bindings/python/pyproject.toml
            bindings/python/src/tui_test/_config.py
          )
          diff -u \
            <(printf '%s\n' "${version_files[@]}" | sort) \
            <(rg -l --path-separator / --fixed-strings "$version" \
              "${version_files[@]}" | sort)

      - name: Verify tui-test-rs crate package
        run: cargo publish --locked --package tui-test-rs --dry-run

  build-cli:
    needs: verify
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: ${{ matrix.target }}

      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild

      - if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --locked -p tui-test-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - if: contains(matrix.target, 'musl')
        run: cargo zigbuild --release --locked -p tui-test-cli --target ${{ matrix.target }}

      - if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../tui-test-${{ matrix.target }}.tar.gz tui-test
          cd -

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/tui-test.exe" -DestinationPath "tui-test-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-test-${{ matrix.target }}
          path: |
            tui-test-*.tar.gz
            tui-test-*.zip

  build-node:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            args: --target aarch64-unknown-linux-gnu -x
            zigbuild: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            args: --target x86_64-unknown-linux-musl -x
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            args: --target aarch64-unknown-linux-musl -x
            zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-latest
            args: --target x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            args: --target aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            args: --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: ${{ matrix.target }}

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        if: matrix.zigbuild
        with:
          tool: cargo-zigbuild

      - run: npm ci
        working-directory: bindings/js

      - name: Build Node shared library
        working-directory: bindings/js
        shell: bash
        run: npm run build:native -- ${{ matrix.args }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.target }}
          path: |
            bindings/js/native/*.so
            bindings/js/native/*.dylib
            bindings/js/native/*.dll
          if-no-files-found: error

  package-node:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json

      - run: npm ci
        working-directory: bindings/js

      - run: npm run build:ts
        working-directory: bindings/js

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-*
          path: bindings/js/artifacts
          merge-multiple: true

      - name: Pack Node packages
        run: node .github/scripts/release/package-node.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Test packed Node package with Node 20
        shell: bash
        run: |
          node="$(command -v node)"
          version="$RELEASE_TAG"
          mkdir package-test
          cd package-test
          npm init -y >/dev/null
          npm install --ignore-scripts \
            "$GITHUB_WORKSPACE/package-artifacts/npm/microsoft-tui-test-linux-x64-gnu-${version}.tgz"
          npm install --ignore-scripts \
            "$GITHUB_WORKSPACE/package-artifacts/npm/microsoft-tui-test-${version}.tgz"
          cd "$GITHUB_WORKSPACE"
          PATH="/usr/bin:/bin" \
          TUI_TEST_BIN="$GITHUB_WORKSPACE/package-test/missing-tui-test" \
          TUI_TEST_TEST_PACKAGE_ROOT="$GITHUB_WORKSPACE/package-test" \
            "$node" --test bindings/js/test/package.integration.test.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: package-artifacts/npm/*.tgz
          if-no-files-found: error

  build-python:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            wheel: cp311-manylinux_x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            wheel: cp311-manylinux_aarch64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            wheel: cp311-musllinux_x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            wheel: cp311-musllinux_aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            wheel: cp311-macosx_x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            wheel: cp311-macosx_arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            wheel: cp311-win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Rust for host wheel builds
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: runner.os != 'Linux'
        with:
          version: "0.16.0"
          cache-key: ${{ matrix.target }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: runner.os == 'Linux' && contains(matrix.target, 'aarch64')
        with:
          platforms: arm64

      - name: Build Python wheel
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          package-dir: bindings/python
          output-dir: bindings/python/dist
          only: ${{ matrix.wheel }}
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CIBW_ENVIRONMENT_PASS_LINUX: CARGO_BUILD_TARGET
          CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          CIBW_BEFORE_ALL_LINUX: bash {project}/.github/scripts/release/prepare-python-linux.sh
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
          CIBW_TEST_COMMAND: python {project}/bindings/python/examples/shared_library.py

      - name: Build Python sdist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --sdist bindings/python --outdir bindings/python/dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          python-version: "3.8"

      - name: Test Python wheel with Python 3.8
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(bindings/python/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          [[ "${wheels[0]}" == *py3-none* ]]
          python -m venv package-test-python-38
          package-test-python-38/bin/python -m pip install \
            --disable-pip-version-check bindings/python/dist/*.whl
          ! PATH="$GITHUB_WORKSPACE/package-test-python-38/bin:/usr/bin:/bin" \
            command -v tui-test
          PATH="$GITHUB_WORKSPACE/package-test-python-38/bin:/usr/bin:/bin" \
          TUI_TEST_BIN="$GITHUB_WORKSPACE/package-test-python-38/missing-tui-test" \
            "$GITHUB_WORKSPACE/package-test-python-38/bin/python" \
            bindings/python/tests/test_integration.py \
            IntegrationTests.test_echo_roundtrip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish-npm:
    needs:
      - package-node
      - release
    if: always() && needs.package-node.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Publish native and root packages
        shell: bash
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          version="$RELEASE_TAG"
          npm_tag=latest
          if [[ "$version" == *-beta.* ]]; then
            npm_tag=beta
          fi
          packages=(
            tui-test-darwin-arm64
            tui-test-darwin-x64
            tui-test-linux-arm64-gnu
            tui-test-linux-arm64-musl
            tui-test-linux-x64-gnu
            tui-test-linux-x64-musl
            tui-test-win32-x64-msvc
            tui-test
          )

          for package in "${packages[@]}"; do
            name="@microsoft/$package"
            tarball="$GITHUB_WORKSPACE/npm-packages/microsoft-${package}-${version}.tgz"
            if [[ ! -f "$tarball" ]]; then
              echo "Missing npm package tarball: $tarball" >&2
              exit 1
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$tarball" --access public --provenance --tag "$npm_tag"
            fi
          done

  publish-pypi:
    needs:
      - build-python
      - release
    if: always() && needs.build-python.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tui-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-sdist
          path: dist

      - name: Publish tui-test to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  publish-crates:
    needs:
      - verify
      - release
    if: always() && needs.verify.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/tui-test-rs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable

      # Match this workflow and environment in the crate's trusted publisher settings.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish tui-test-rs to crates.io
        run: cargo publish --locked --package tui-test-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs:
      - build-cli
      - package-node
      - build-python
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: tui-test-*
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_args=(--generate-notes)
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_args[@]}" artifacts/*

  update-homebrew:
    name: Open Homebrew formula update
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update Homebrew formula
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets |
            node .github/scripts/release/update-homebrew-formula.mjs "$RELEASE_TAG"

      - name: Open a pull request
        shell: bash
        run: |
          set -euo pipefail
          branch="homebrew-update/$RELEASE_TAG"
          title="chore(homebrew): update formula to $RELEASE_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/tui-test.rb
          git commit -s -m "$title"
          git push origin "$branch"
          gh pr create --head "$branch" --base main --title "$title" --body ""
