name: Release

on:
  push:
    tags:
      - "*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta release tag to publish (for example, 0.1.0-beta.3)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable

      - run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify beta release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Release tag must match <major>.<minor>.<patch>-beta.<number>." >&2
            exit 1
          fi

      - name: Verify release versions
        shell: bash
        run: |
          version="$RELEASE_TAG"
          version_files=(
            Cargo.toml
            bindings/js/package.json
            bindings/js/package-lock.json
            bindings/js/src/version.ts
            bindings/python/pyproject.toml
            bindings/python/src/tui_test/_config.py
            bindings/js/native/index.js
          )
          diff -u \
            <(printf '%s\n' "${version_files[@]}" | sort) \
            <(rg -l --path-separator / --fixed-strings "$version" \
              "${version_files[@]}" | sort)

      - name: Verify tui-test-rs crate package
        run: cargo publish --locked --package tui-test-rs --dry-run

  build-cli:
    needs: verify
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: ${{ matrix.target }}

      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild

      - if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --locked -p tui-test-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - if: contains(matrix.target, 'musl')
        run: cargo zigbuild --release --locked -p tui-test-cli --target ${{ matrix.target }}

      - if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../tui-test-${{ matrix.target }}.tar.gz tui-test
          cd -

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/tui-test.exe" -DestinationPath "tui-test-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-test-${{ matrix.target }}
          path: |
            tui-test-*.tar.gz
            tui-test-*.zip

  build-go:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bindings/go/go.mod
          cache: false

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: go-${{ matrix.target }}

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild

      - name: Build Go native library
        if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --locked -p tui-test-go --target ${{ matrix.target }}

      - name: Build Go native library for musl
        if: contains(matrix.target, 'musl')
        run: cargo zigbuild --release --locked -p tui-test-go --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C target-feature=-crt-static

      - name: Package native library
        run: |
          set -euo pipefail
          mkdir -p go-package/include go-package/lib
          cp bindings/go/internal/native/native.h go-package/include/tui_test_go.h
          cp LICENSE go-package/
          printf 'version=%s\ntarget=%s\ncommit=%s\n' "$RELEASE_TAG" '${{ matrix.target }}' "$(git rev-parse HEAD)" > go-package/VERSION
          case '${{ matrix.target }}' in
            *windows*)
              cp target/${{ matrix.target }}/release/tui_test_go.dll go-package/lib/
              ;;
            *darwin*) cp target/${{ matrix.target }}/release/libtui_test_go.dylib go-package/lib/ ;;
            *) cp target/${{ matrix.target }}/release/libtui_test_go.so go-package/lib/ ;;
          esac
          archive="tui-test-go-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C go-package .
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
            sha256sum -c "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
            shasum -a 256 -c "$archive.sha256"
          fi
          mkdir go-installed
          tar -xzf "$archive" -C go-installed
          mkdir -p bindings/go/internal/native/embedded/${{ matrix.target }}
          cp go-installed/lib/* bindings/go/internal/native/embedded/${{ matrix.target }}/

      - name: Prepare external consumer
        run: |
          mkdir go-consumer
          cp bindings/go/examples/smoke/main.go go-consumer/
          cd go-consumer
          go mod init example.com/go-package-smoke
          go mod edit -require=github.com/microsoft/tui-test/bindings/go@v0.0.0
          go mod edit -replace=github.com/microsoft/tui-test/bindings/go=../bindings/go

      - name: Test packaged library without Rust on Unix
        if: runner.os != 'Windows' && !contains(matrix.target, 'musl')
        working-directory: go-consumer
        run: |
          go_bin="$(command -v go)"
          export PATH="$(dirname "$go_bin"):/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
            echo 'Rust is visible in consumer environment' >&2
            exit 1
          fi
          export CGO_ENABLED=0
          go mod tidy
          go build -o smoke .
          ./smoke

      - name: Test packaged library without Rust on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: go-consumer
        run: |
          $goBin = Split-Path (Get-Command go).Source
          $env:PATH = "$goBin;$env:SystemRoot\System32;$env:SystemRoot"
          if ((Get-Command cargo,rustc -ErrorAction SilentlyContinue)) { throw 'Rust is visible in consumer environment' }
          $env:CGO_ENABLED = '0'
          go mod tidy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -o smoke.exe .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./smoke.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test packaged musl library without Rust
        if: contains(matrix.target, 'musl')
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/go-consumer golang:1.26-alpine sh -ec '
            if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
              echo "Rust is visible in consumer environment" >&2
              exit 1
            fi
            export CGO_ENABLED=0
            go mod tidy
            go build -o smoke .
            ./smoke
          '

      - name: Check Go native layout against the host C compiler
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
        run: |
          "$(go env CC)" --version
          go test -tags=tuitest_abi_check -run '^TestNativeLayoutMatchesCompiler$' -count=1 ./internal/native

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-test-go-${{ matrix.target }}
          path: |
            tui-test-go-*.tar.gz
            tui-test-go-*.sha256
          if-no-files-found: error

  assemble-go-module:
    needs: build-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tui-test-go-*
          path: go-packages
          merge-multiple: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bindings/go/go.mod
          cache: false

      - name: Assemble the Go module with all native libraries
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl
            x86_64-apple-darwin aarch64-apple-darwin
            x86_64-pc-windows-msvc
          )
          for target in "${targets[@]}"; do
            (cd go-packages && sha256sum -c "tui-test-go-$target.tar.gz.sha256")
            mkdir -p "go-unpacked/$target" "bindings/go/internal/native/embedded/$target"
            tar -xzf "go-packages/tui-test-go-$target.tar.gz" -C "go-unpacked/$target"
            grep -Fx "version=$RELEASE_TAG" "go-unpacked/$target/VERSION"
            grep -Fx "target=$target" "go-unpacked/$target/VERSION"
            grep -Fx "commit=$(git rev-parse HEAD)" "go-unpacked/$target/VERSION"
            case "$target" in
              *windows*) library=tui_test_go.dll ;;
              *darwin*) library=libtui_test_go.dylib ;;
              *) library=libtui_test_go.so ;;
            esac
            test -s "go-unpacked/$target/lib/$library"
            test "$(wc -c < "go-unpacked/$target/lib/$library")" -lt 100000000
            cp "go-unpacked/$target/lib/$library" "bindings/go/internal/native/embedded/$target/$library"
          done
          cp LICENSE bindings/go/LICENSE
          printf 'version=%s\nsource-tag=%s\nsource-commit=%s\n' "$RELEASE_TAG" "$RELEASE_TAG" "$(git rev-parse HEAD)" > bindings/go/internal/native/embedded/RELEASE
          module_bytes="$(find bindings/go -type f -printf '%s\n' | awk '{bytes += $1} END {printf "%.0f", bytes}')"
          test "$module_bytes" -lt 524288000
          tar -czf tui-test-go-module.tar.gz -C bindings/go .
          sha256sum tui-test-go-module.tar.gz > tui-test-go-module.tar.gz.sha256

      - name: Test the assembled module from an independent consumer
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir assembled-module assembled-consumer
          tar -xzf tui-test-go-module.tar.gz -C assembled-module
          cp assembled-module/examples/smoke/main.go assembled-consumer/
          cd assembled-consumer
          go mod init example.com/assembled-go-module-smoke
          go mod edit -require=github.com/microsoft/tui-test/bindings/go@v0.0.0
          go mod edit -replace=github.com/microsoft/tui-test/bindings/go=../assembled-module
          go mod tidy
          go build -o smoke .
          ./smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-test-go-module
          path: |
            tui-test-go-module.tar.gz
            tui-test-go-module.tar.gz.sha256
          if-no-files-found: error

  publish-go-module:
    needs:
      - assemble-go-module
      - release
    if: always() && needs.assemble-go-module.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tui-test-go-module

      - name: Publish the bundled Go module tag
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c tui-test-go-module.tar.gz.sha256
          tar -xzf tui-test-go-module.tar.gz -C bindings/go
          grep -Fx "source-commit=$(git rev-parse HEAD)" bindings/go/internal/native/embedded/RELEASE
          tag="bindings/go/v$RELEASE_TAG"
          git add --force -- bindings/go/internal/native/embedded bindings/go/LICENSE
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$existing" ]]; then
            git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            git diff --exit-code "$tag" -- bindings/go
            echo "$tag already contains this bundled module"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --signoff -m "build(go): bundle native libraries for $RELEASE_TAG"
          git tag "$tag"
          git push origin "refs/tags/$tag:refs/tags/$tag"

  build-node:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            args: --target x86_64-unknown-linux-gnu --use-napi-cross
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            args: --target aarch64-unknown-linux-gnu -x
            zigbuild: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            args: --target x86_64-unknown-linux-musl -x
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            args: --target aarch64-unknown-linux-musl -x
            zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-latest
            args: --target x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            args: --target aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            args: --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: ${{ matrix.target }}

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        if: matrix.zigbuild
        with:
          tool: cargo-zigbuild

      - run: npm ci
        working-directory: bindings/js

      - name: Build Node addon
        working-directory: bindings/js
        shell: bash
        run: npm run build:native -- ${{ matrix.args }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-${{ matrix.target }}
          path: bindings/js/native/*.node
          if-no-files-found: error

  package-node:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json

      - run: npm ci
        working-directory: bindings/js

      - run: |
          npm run build:ts
          npm run create:npm-dirs
        working-directory: bindings/js

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: node-*
          path: bindings/js/artifacts
          merge-multiple: true

      - run: npm run artifacts
        working-directory: bindings/js

      - name: Pack Node packages
        run: node .github/scripts/release/package-node.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Test packed Node package with Node 20
        shell: bash
        run: |
          node="$(command -v node)"
          version="$RELEASE_TAG"
          mkdir package-test
          cd package-test
          npm init -y >/dev/null
          npm install --ignore-scripts \
            "$GITHUB_WORKSPACE/package-artifacts/npm/microsoft-tui-test-linux-x64-gnu-${version}.tgz"
          npm install --ignore-scripts --omit=optional \
            "$GITHUB_WORKSPACE/package-artifacts/npm/microsoft-tui-test-${version}.tgz"
          cd "$GITHUB_WORKSPACE"
          PATH="/usr/bin:/bin" \
          TUI_TEST_BIN="$GITHUB_WORKSPACE/package-test/missing-tui-test" \
          TUI_TEST_TEST_PACKAGE_ROOT="$GITHUB_WORKSPACE/package-test" \
            "$node" --test bindings/js/test/package.integration.test.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: package-artifacts/npm/*.tgz
          if-no-files-found: error

  build-python:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            compatibility: "2_28"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            compatibility: "2_28"
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            compatibility: "musllinux_1_2"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            compatibility: "musllinux_1_2"
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: runner.os != 'Linux'
        with:
          version: "0.16.0"
          cache-key: ${{ matrix.target }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: runner.os == 'Linux' && contains(matrix.target, 'aarch64')
        with:
          platforms: arm64

      - name: Build Python wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.compatibility || 'auto' }}
          args: --release --locked --out dist --compatibility pypi
          before-script-linux: |
            set -euo pipefail
            version=0.16.0
            case "$(uname -m)" in
              x86_64|amd64)
                arch=x86_64
                sha256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
                ;;
              aarch64|arm64)
                arch=aarch64
                sha256=ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
                ;;
              *)
                echo "unsupported Zig host architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac
            if command -v yum >/dev/null 2>&1; then
              yum install -y curl xz
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends curl xz-utils
            fi
            archive="zig-${arch}-linux-${version}.tar.xz"
            curl -fsSLo "/tmp/${archive}" \
              "https://ziglang.org/download/${version}/${archive}"
            echo "${sha256}  /tmp/${archive}" | sha256sum -c -
            tar -xJf "/tmp/${archive}" -C /opt
            ln -s "/opt/zig-${arch}-linux-${version}/zig" /usr/local/bin/zig
            zig version

      - name: Build Python sdist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: bindings/python
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python -m pip install --disable-pip-version-check "maturin>=1.5,<2"
          maturin sdist --manifest-path native/Cargo.toml --out dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          python-version: "3.8"

      - name: Test Python wheel with Python 3.8
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(bindings/python/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          [[ "${wheels[0]}" == *abi3* ]]
          python -m venv package-test-python-38
          package-test-python-38/bin/python -m pip install \
            --disable-pip-version-check bindings/python/dist/*.whl
          ! PATH="$GITHUB_WORKSPACE/package-test-python-38/bin:/usr/bin:/bin" \
            command -v tui-test
          PATH="$GITHUB_WORKSPACE/package-test-python-38/bin:/usr/bin:/bin" \
          TUI_TEST_BIN="$GITHUB_WORKSPACE/package-test-python-38/missing-tui-test" \
            "$GITHUB_WORKSPACE/package-test-python-38/bin/python" \
            bindings/python/tests/test_integration.py \
            IntegrationTests.test_echo_roundtrip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish-npm:
    needs:
      - package-node
      - release
    if: always() && needs.package-node.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: npm-packages

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Publish native and root packages
        shell: bash
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          version="$RELEASE_TAG"
          packages=(
            tui-test-darwin-arm64
            tui-test-darwin-x64
            tui-test-linux-arm64-gnu
            tui-test-linux-arm64-musl
            tui-test-linux-x64-gnu
            tui-test-linux-x64-musl
            tui-test-win32-x64-msvc
            tui-test
          )

          for package in "${packages[@]}"; do
            name="@microsoft/$package"
            tarball="$GITHUB_WORKSPACE/npm-packages/microsoft-${package}-${version}.tgz"
            if [[ ! -f "$tarball" ]]; then
              echo "Missing npm package tarball: $tarball" >&2
              exit 1
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$tarball" --access public --provenance --tag beta
            fi
          done

  publish-pypi:
    needs:
      - build-python
      - release
    if: always() && needs.build-python.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tui-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: dist

      - name: Publish tui-test to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-crates:
    needs:
      - verify
      - release
    if: always() && needs.verify.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/tui-test-rs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable

      # Match this workflow and environment in the crate's trusted publisher settings.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish tui-test-rs to crates.io
        run: cargo publish --locked --package tui-test-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs:
      - build-cli
      - assemble-go-module
      - package-node
      - build-python
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: tui-test-*
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --generate-notes \
            --prerelease \
            artifacts/*

  update-homebrew:
    name: Open Homebrew formula update
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update Homebrew formula
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets |
            node .github/scripts/release/update-homebrew-formula.mjs "$RELEASE_TAG"

      - name: Open a pull request
        shell: bash
        run: |
          set -euo pipefail
          branch="homebrew-update/$RELEASE_TAG"
          title="chore(homebrew): update formula to $RELEASE_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/tui-test.rb
          git commit -s -m "$title"
          git push origin "$branch"
          gh pr create --head "$branch" --base main --title "$title" --body ""
