[package]
name = "tui-test-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "napi-rs Node.js addon for the tui_test terminal engine"
repository.workspace = true
publish = false

[lib]
name = "tui_test_node"
path = "native/lib.rs"
crate-type = ["cdylib", "rlib"]
test = false

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "dyn-symbols", "async"] }
napi-derive = "3"
tui-test = { workspace = true, features = ["ghostty"] }

[build-dependencies]
napi-build = "2"
