[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "shell-use"
version = "0.0.1-beta.5"
description = "Python bindings for shell-use terminal automation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Microsoft" }]
keywords = ["terminal", "pty", "automation", "testing", "tui", "shell-use"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/microsoft/shell-use"
Repository = "https://github.com/microsoft/shell-use"

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "shell_use._native"
python-source = "src"
features = ["extension-module"]
