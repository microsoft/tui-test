[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.9,<2", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "tui-test"
version = "0.1.0"
description = "Python bindings for tui-test terminal automation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Microsoft" }]
keywords = ["terminal", "pty", "automation", "testing", "tui", "tui-test"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/microsoft/tui-test"
Repository = "https://github.com/microsoft/tui-test"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tui_test = ["*.pyi", "py.typed"]
