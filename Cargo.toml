[workspace]
members = [
    "bindings/js",
    "bindings/python/native",
    "crates/shell-use",
    "crates/shell-use-cli",
]
default-members = [
    "crates/shell-use",
    "crates/shell-use-cli",
]
resolver = "2"

[workspace.package]
version = "0.0.1-beta.6"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/microsoft/shell-use"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.102"
bitflags = "2.13.1"
clap = { version = "4.6.1", features = ["derive"] }
compact_str = "0.10.0"
crossterm = "0.28"
dialoguer = { version = "0.11", default-features = false }
dirs = "6.0.0"
flate2 = "1.1.9"
interprocess = "2.4.2"
portable-pty = "0.9.0"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
toml = "0.9"
shell-use = { path = "crates/shell-use" }
unicode-width = "0.2.2"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[profile.release]
strip = true
lto = true
