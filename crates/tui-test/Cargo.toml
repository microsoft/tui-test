[package]
name = "tui-test-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "In-process terminal automation, inspection, assertions, and recording"
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[lib]
name = "tui_test"
path = "src/lib.rs"

[features]
default = []
ghostty = ["dep:ghostty-vt"]
rio = ["dep:rio-vt"]
xtermjs = ["dep:rquickjs"]
recording-raster = ["dep:fontdb", "dep:gif", "dep:png", "dep:tiny-skia"]
recording-font-jetbrains-mono = ["recording-raster"]
recording-font-jetbrains-mono-styles = ["recording-font-jetbrains-mono"]
recording-font-jetbrains-mono-full = ["recording-font-jetbrains-mono-styles"]

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
bitflags.workspace = true
compact_str.workspace = true
dirs.workspace = true
dunce.workspace = true
flate2.workspace = true
fontdb = { workspace = true, optional = true }
gif = { workspace = true, optional = true }
ghostty-vt = { workspace = true, optional = true }
png = { workspace = true, optional = true }
portable-pty.workspace = true
regex.workspace = true
rio-vt = { workspace = true, optional = true }
rquickjs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tiny-skia = { workspace = true, optional = true }
ttf-parser.workspace = true
unicode-width.workspace = true
